[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reviewraccoon-server"
version = "0.1.0"
description = "Backend API and moved-block detection engine for ReviewRaccoon."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "certifi==2026.2.25",
    "charset-normalizer==3.4.5",
    "falcon==2.0.0",
    "fuzzyset==0.1.2",
    "gunicorn==25.1.0",
    "idna==3.15",
    "levenshtein==0.21.1",
    "packaging==26.0",
    "python-levenshtein==0.21.1",
    "rapidfuzz==3.14.3",
    "requests==2.32.5",
    "unidiff==0.7.5",
    "urllib3==2.6.3",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[tool.setuptools]
package-dir = { "" = "server" }
py-modules = [
    "detector",
    "fuzzyset",
    "main",
    "setup_logging",
    "time_utils",
]

[tool.pytest.ini_options]
testpaths = ["server/tests"]
python_files = ["test_*.py", "*_test.py", "*_tests.py"]

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["server"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false

[tool.ty.environment]
python-version = "3.10"
root = ["./server"]

[tool.ty.src]
include = ["server"]
respect-ignore-files = true
